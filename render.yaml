services:
  - type: web
    name: masdar-web
    env: docker
    branch: feature_of_fixing_everything
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__ApplyMigrations
        value: "true"
      - key: SeedData__Enabled
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: masdar-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: masdar-db
    databaseName: masdar
    user: masdar_user
    plan: free
    region: oregon
