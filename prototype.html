<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MASDAR | Your University Knowledge Hub</title>
  <meta name="description" content="A community-curated university learning platform with trusted resources, guided course roadmaps, and a course-aware AI tutor.">
  <script>
    try {
      const savedTheme = localStorage.getItem('masdar-theme');
      const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = savedTheme || preferredTheme;
    } catch (_) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <script src="./lucide.min.js"></script>
  <style>
    :root {
      --navy-950: #081126;
      --navy-900: #0d1b38;
      --navy-800: #14264a;
      --blue-700: #1754d1;
      --blue-600: #246bfd;
      --blue-500: #4285ff;
      --blue-100: #e8f0ff;
      --blue-50: #f3f7ff;
      --cyan-600: #0891b2;
      --cyan-100: #cff7fc;
      --amber-600: #d97706;
      --amber-100: #fef3c7;
      --green-700: #047857;
      --green-100: #d1fae5;
      --red-600: #dc2626;
      --red-100: #fee2e2;
      --ink-900: #111b31;
      --ink-700: #3a4862;
      --ink-500: #6d7890;
      --ink-400: #929caf;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --surface-soft: #f8fafc;
      --surface-tint: #f2f6fd;
      --canvas: #f3f6fb;
      --line: #e0e6f0;
      --line-strong: #cfd8e6;
      --input-bg: #ffffff;
      --header-bg: rgba(255,255,255,.88);
      --tag-bg: #eef2f7;
      --neutral-soft: #edf1f6;
      --shadow-sm: 0 2px 8px rgba(12, 27, 56, 0.06);
      --shadow-md: 0 14px 34px rgba(12, 27, 56, 0.11);
      --shadow-lg: 0 24px 60px rgba(8, 17, 38, 0.18);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --sidebar: 256px;
      --topbar: 76px;
      --ease: 180ms ease;
      font-family: "Segoe UI Variable Text", "Segoe UI", "Noto Sans", Roboto, Helvetica, Arial, sans-serif;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --navy-950: #050a15;
      --navy-900: #0a1222;
      --navy-800: #111e35;
      --blue-700: #6d9bff;
      --blue-600: #4f82ff;
      --blue-500: #76a0ff;
      --blue-100: #18356d;
      --blue-50: #101d34;
      --cyan-100: #103b45;
      --cyan-600: #55c8df;
      --amber-100: #412d0c;
      --amber-600: #f2b84b;
      --green-100: #0d3b31;
      --green-700: #58d7b1;
      --red-100: #451b21;
      --red-600: #ff7886;
      --ink-900: #f1f5fb;
      --ink-700: #c7d1e1;
      --ink-500: #93a1b7;
      --ink-400: #718097;
      --surface: #111a2a;
      --surface-raised: #162134;
      --surface-soft: #0d1625;
      --surface-tint: #101c30;
      --canvas: #08101d;
      --line: #243249;
      --line-strong: #34435b;
      --input-bg: #0d1727;
      --header-bg: rgba(8,16,29,.86);
      --tag-bg: #1b273a;
      --neutral-soft: #1b2738;
      --shadow-sm: 0 3px 12px rgba(0,0,0,.18);
      --shadow-md: 0 18px 42px rgba(0,0,0,.28);
      --shadow-lg: 0 28px 70px rgba(0,0,0,.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { min-height: 100vh; background: var(--canvas); color: var(--ink-900); overflow-x: hidden; font-size: 14px; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; transition: background-color .2s ease, color .2s ease; }
    body.panel-open { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button { border: 0; background: none; color: inherit; cursor: pointer; }
    input, select, textarea { color: var(--ink-900); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid rgba(36, 107, 253, 0.26);
      outline-offset: 2px;
    }
    h1, h2, h3, h4 { font-family: "Segoe UI Variable Display", "Segoe UI", "Noto Sans", sans-serif; letter-spacing: -0.022em; text-wrap: balance; }
    strong, h1, h2, h3, h4 { font-weight: 720; }
    time, .quality-number, .leader-points, .exam-days, .progress-value { font-variant-numeric: tabular-nums; }
    p { line-height: 1.55; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .muted { color: var(--ink-500); }
    .nowrap { white-space: nowrap; }

    /* Shell */
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar);
      display: flex;
      flex-direction: column;
      padding: 22px 16px 18px;
      background: var(--navy-950);
      color: #fff;
      z-index: 60;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 26px; text-align: left; }
    .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: var(--blue-600); box-shadow: 0 8px 18px rgba(36,107,253,.28); }
    .brand-mark svg { width: 20px; height: 20px; }
    .brand-copy { display: flex; align-items: baseline; gap: 6px; }
    .brand-name { font-size: 18px; font-weight: 800; letter-spacing: .02em; }
    .brand-ar { color: #8da9e9; font-size: 13px; }
    .side-label { padding: 0 12px 8px; color: #7383a5; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .side-nav { display: flex; flex-direction: column; gap: 5px; }
    .side-link { width: 100%; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; color: #aebbd5; font-size: 13px; font-weight: 650; text-align: left; transition: var(--ease); }
    .side-link svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .side-link:hover { color: #fff; background: rgba(255,255,255,.07); }
    .side-link.active { color: #fff; background: var(--blue-600); box-shadow: 0 8px 18px rgba(36,107,253,.22); }
    .side-divider { height: 1px; margin: 20px 8px; background: rgba(255,255,255,.09); }
    .side-label-row { display: flex; align-items: center; justify-content: space-between; padding: 0 12px 8px; }
    .side-label-row .side-label { padding: 0; }
    .side-action-link { display: inline-flex; align-items: center; gap: 4px; color: #8da3c9; font-size: 11px; font-weight: 750; background: none; border: 0; cursor: pointer; padding: 2px 6px; border-radius: 6px; transition: var(--ease); }
    .side-action-link:hover { color: #fff; background: rgba(255,255,255,.1); }
    .side-action-link svg { width: 12px; height: 12px; }
    .current-course-card { display: block; width: 100%; margin: 0; padding: 14px; border: 1px solid rgba(255,255,255,.11); border-radius: 16px; background: rgba(255,255,255,.055); text-align: left; transition: var(--ease); box-sizing: border-box; }
    .current-course-card:hover { background: rgba(255,255,255,.085); transform: translateY(-1px); }
    .current-course-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 7px; }
    .course-code-dark { color: #8fb1ff; font-size: 10px; font-weight: 800; letter-spacing: .04em; }
    .course-arrow { color: #7f8ca7; flex-shrink: 0; }
    .current-course-name { display: block; color: #fff; font-size: 13px; font-weight: 750; margin-bottom: 4px; }
    .current-course-meta { display: block; color: #8d9ab6; font-size: 10px; }
    .mini-progress { display: block; width: 100%; height: 5px; margin-top: 12px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.12); position: relative; box-sizing: border-box; }
    .mini-progress span { display: block; height: 100%; border-radius: 999px; background: var(--blue-500); transition: width 0.3s ease; }
    .sidebar-spacer { flex: 1; min-height: 12px; }
    .tutor-side-card { padding: 14px; border-radius: 16px; background: linear-gradient(145deg, #173673, #112957); }
    .tutor-side-icon { width: 34px; height: 34px; display: grid; place-items: center; margin-bottom: 10px; border-radius: 11px; background: rgba(255,255,255,.12); }
    .tutor-side-icon svg { width: 18px; height: 18px; }
    .tutor-side-card strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .tutor-side-card p { color: #a9bce3; font-size: 10px; }
    .tutor-side-button { width: 100%; margin-top: 12px; padding: 9px 10px; border-radius: 10px; background: #fff; color: var(--blue-700); font-size: 11px; font-weight: 800; }

    .app-frame { min-height: 100vh; margin-left: var(--sidebar); }
    .topbar { position: sticky; top: 0; z-index: 50; height: var(--topbar); display: flex; align-items: center; gap: 18px; padding: 0 30px; border-bottom: 1px solid rgba(227,232,241,.9); background: rgba(255,255,255,.93); backdrop-filter: blur(16px); }
    .mobile-brand { display: none; }
    .top-search { position: relative; flex: 1; max-width: 520px; }
    .top-search svg { position: absolute; left: 14px; top: 50%; width: 17px; height: 17px; color: var(--ink-400); transform: translateY(-50%); pointer-events: none; }
    .top-search input { width: 100%; height: 42px; padding: 0 14px 0 42px; border: 1px solid var(--line); border-radius: 13px; background: var(--canvas); font-size: 13px; outline: 0; transition: var(--ease); }
    .top-search input:focus { border-color: #9dbbff; background: #fff; box-shadow: 0 0 0 4px rgba(36,107,253,.08); }
    .topbar-actions { display: flex; align-items: center; gap: 9px; margin-left: auto; }
    .course-context-pill { height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; text-align: left; }
    .context-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue-600); box-shadow: 0 0 0 4px var(--blue-100); }
    .context-copy { line-height: 1.05; }
    .context-copy strong { display: block; font-size: 11px; }
    .context-copy span { color: var(--ink-500); font-size: 9px; }
    .top-icon { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink-700); }
    .top-icon:hover { border-color: #b8c8e9; color: var(--blue-600); }
    .top-icon svg { width: 18px; height: 18px; }
    .user-menu { display: flex; align-items: center; gap: 9px; padding-left: 5px; }
    .avatar { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: var(--navy-900); color: #fff; font-size: 11px; font-weight: 800; }
    .user-copy strong { display: block; font-size: 11px; }
    .user-copy span { color: var(--ink-500); font-size: 9px; }
    .main { max-width: 1240px; margin: 0 auto; padding: 34px 34px 72px; }
    .page-enter { animation: pageEnter 260ms ease both; }
    @keyframes pageEnter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Shared components */
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .eyebrow { margin-bottom: 7px; color: var(--blue-600); font-size: 10px; font-weight: 850; letter-spacing: .11em; text-transform: uppercase; }
    .page-head h1 { font-size: clamp(25px, 3vw, 34px); line-height: 1.12; }
    .page-head p { max-width: 620px; margin-top: 8px; color: var(--ink-500); font-size: 13px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 30px 0 14px; }
    .section-head h2 { font-size: 18px; }
    .section-head p { margin-top: 3px; color: var(--ink-500); font-size: 11px; }
    .section-link { display: flex; align-items: center; gap: 5px; color: var(--blue-600); font-size: 11px; font-weight: 750; }
    .section-link svg { width: 14px; height: 14px; }
    .card { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
    .btn { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; border-radius: 11px; font-size: 12px; font-weight: 760; transition: var(--ease); }
    .btn svg { width: 16px; height: 16px; }
    .btn-primary { background: var(--blue-600); color: #fff; box-shadow: 0 8px 18px rgba(36,107,253,.2); }
    .btn-primary:hover { background: var(--blue-700); transform: translateY(-1px); }
    .btn-secondary { border: 1px solid var(--line-strong); background: #fff; color: var(--ink-700); }
    .btn-secondary:hover { border-color: #9fb4dd; color: var(--blue-700); }
    .btn-soft { background: var(--blue-100); color: var(--blue-700); }
    .btn-soft:hover { background: #dce8ff; }
    .btn-danger-soft { background: var(--red-100); color: var(--red-600); }
    .btn-small { min-height: 34px; padding: 0 12px; font-size: 10px; }
    .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
    .icon-button { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--ink-500); }
    .icon-button:hover { color: var(--blue-600); border-color: #aebfe0; }
    .icon-button svg { width: 16px; height: 16px; }
    .field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    .field label { color: var(--ink-700); font-size: 10px; font-weight: 750; }
    .field input, .field select, .field textarea { width: 100%; min-width: 0; border: 1px solid var(--line-strong); border-radius: 11px; background: #fff; outline: 0; transition: var(--ease); }
    .field input, .field select { height: 42px; padding: 0 12px; font-size: 12px; }
    .field textarea { min-height: 96px; padding: 11px 12px; resize: vertical; font-size: 12px; line-height: 1.5; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #8baeff; box-shadow: 0 0 0 4px rgba(36,107,253,.08); }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 999px; font-size: 9px; font-weight: 820; line-height: 1; }
    .badge svg { width: 11px; height: 11px; }
    .badge-blue { background: var(--blue-100); color: var(--blue-700); }
    .badge-green { background: var(--green-100); color: var(--green-700); }
    .badge-amber { background: var(--amber-100); color: var(--amber-600); }
    .badge-gray { background: #eef1f6; color: #59657a; }
    .empty-state { padding: 46px 24px; border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); background: rgba(255,255,255,.5); text-align: center; }
    .empty-icon { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto 12px; border-radius: 15px; background: var(--blue-100); color: var(--blue-600); }
    .empty-icon svg { width: 22px; height: 22px; }
    .empty-state h3 { font-size: 15px; }
    .empty-state p { margin: 6px auto 16px; color: var(--ink-500); font-size: 11px; }

    /* Home */
    .home-hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0,1.35fr) minmax(260px,.65fr); gap: 34px; min-height: 288px; padding: 38px 40px; border-radius: var(--radius-xl); background: var(--navy-950); color: #fff; box-shadow: var(--shadow-md); }
    .home-hero::before { content: ""; position: absolute; inset: 0; opacity: .22; background-image: linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px); background-size: 34px 34px; mask-image: linear-gradient(90deg,#000,transparent 72%); }
    .home-hero::after { content: ""; position: absolute; width: 300px; height: 300px; right: -95px; top: -130px; border-radius: 50%; background: rgba(36,107,253,.42); filter: blur(10px); }
    .hero-copy, .exam-card { position: relative; z-index: 1; }
    .hero-kicker { display: flex; align-items: center; gap: 7px; margin-bottom: 13px; color: #9bb7ee; font-size: 10px; font-weight: 750; }
    .hero-kicker span { width: 7px; height: 7px; border-radius: 50%; background: #54d7ee; box-shadow: 0 0 0 5px rgba(84,215,238,.12); }
    .home-hero h1 { max-width: 650px; font-size: clamp(28px,4vw,43px); line-height: 1.06; }
    .home-hero h1 em { color: #72a3ff; font-style: normal; }
    .home-hero .hero-desc { max-width: 590px; margin-top: 13px; color: #aebbd1; font-size: 13px; }
    .hero-search { display: flex; gap: 8px; max-width: 570px; margin-top: 24px; padding: 6px; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; background: rgba(255,255,255,.1); backdrop-filter: blur(10px); }
    .hero-search input { min-width: 0; flex: 1; height: 42px; padding: 0 12px; border: 0; outline: 0; background: transparent; color: #fff; font-size: 12px; }
    .hero-search input::placeholder { color: #8292af; }
    .hero-search .btn { min-width: 102px; }
    .exam-card { align-self: center; padding: 20px; border: 1px solid rgba(255,255,255,.13); border-radius: 20px; background: rgba(255,255,255,.085); backdrop-filter: blur(12px); }
    .exam-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .exam-label { color: #93a6c8; font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .exam-days { display: grid; place-items: center; min-width: 42px; height: 28px; border-radius: 9px; background: rgba(245,158,11,.16); color: #ffc25a; font-size: 10px; font-weight: 800; }
    .exam-card h3 { font-size: 18px; }
    .exam-card p { margin-top: 5px; color: #9cacbf; font-size: 10px; }
    .exam-progress-label { display: flex; justify-content: space-between; margin: 18px 0 7px; color: #a8b5cb; font-size: 9px; }
    .exam-progress { height: 7px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.1); }
    .exam-progress span { display: block; height: 100%; border-radius: inherit; background: #5c90ff; }
    .exam-card .btn { width: 100%; margin-top: 18px; background: #fff; color: var(--navy-900); box-shadow: none; }
    .home-grid { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(300px,.85fr); gap: 20px; }
    .continue-card { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; padding: 18px; }
    .course-symbol { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; background: var(--blue-100); color: var(--blue-600); }
    .course-symbol svg { width: 22px; height: 22px; }
    .continue-card h3 { font-size: 14px; }
    .continue-card p { margin-top: 3px; color: var(--ink-500); font-size: 10px; }
    .continue-meta { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
    .progress-inline { width: 120px; height: 6px; overflow: hidden; border-radius: 99px; background: #e9edf4; }
    .progress-inline span { display: block; height: 100%; border-radius: inherit; background: var(--blue-600); }
    .progress-value { color: var(--blue-700); font-size: 9px; font-weight: 800; }
    .next-step-card { padding: 18px; background: var(--blue-50); border-color: #dce7fb; }
    .next-step-card .row { display: flex; align-items: flex-start; gap: 12px; }
    .next-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: #fff; color: var(--blue-600); box-shadow: var(--shadow-sm); }
    .next-icon svg { width: 18px; height: 18px; }
    .next-step-card small { color: var(--blue-700); font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
    .next-step-card h3 { margin-top: 4px; font-size: 13px; }
    .next-step-card p { margin-top: 3px; color: var(--ink-500); font-size: 10px; }
    .resource-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; }
    .resource-card { display: flex; flex-direction: column; min-width: 0; padding: 17px; transition: var(--ease); }
    .resource-card:hover { transform: translateY(-2px); border-color: #c4d3ef; box-shadow: var(--shadow-md); }
    .resource-card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .type-chip { display: inline-flex; align-items: center; gap: 6px; color: var(--blue-700); font-size: 9px; font-weight: 800; }
    .type-chip-icon { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 8px; background: var(--blue-100); }
    .type-chip-icon svg { width: 13px; height: 13px; }
    .verified { display: inline-flex; align-items: center; gap: 4px; color: var(--green-700); font-size: 8px; font-weight: 800; }
    .verified svg { width: 12px; height: 12px; }
    .resource-card h3 { margin-top: 15px; font-size: 14px; line-height: 1.35; }
    .resource-sub { margin-top: 5px; color: var(--ink-500); font-size: 9px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
    .mini-tag { padding: 4px 6px; border-radius: 6px; background: #f0f3f8; color: #667187; font-size: 8px; }
    .resource-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 16px; }
    .quality-score { display: flex; align-items: center; gap: 7px; }
    .quality-score strong { font-size: 12px; }
    .quality-score span { color: var(--ink-500); font-size: 8px; }
    .quality-bar { width: 42px; height: 5px; overflow: hidden; border-radius: 99px; background: #e8ecf3; }
    .quality-bar i { display: block; height: 100%; border-radius: inherit; background: #f7b731; }
    .preview-link { display: flex; align-items: center; gap: 4px; color: var(--blue-600); font-size: 9px; font-weight: 800; }
    .preview-link svg { width: 13px; height: 13px; }
    .roadmap-card { padding: 19px; }

    /* Course workspace */

    .course-hero-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: center; }
    .course-breadcrumb { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; color: #8da3c9; font-size: 9px; }
    .course-breadcrumb button { color: #a9bde1; }

    .course-hero-actions { display: flex; gap: 8px; margin-top: 20px; }

    .course-progress-ring { --progress: 35; width: 112px; height: 112px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(#5d91ff calc(var(--progress)*1%),rgba(255,255,255,.12) 0); }

    .ring-copy { position: absolute; text-align: center; }

    .ring-copy span { color: #90a1bd; font-size: 8px; text-transform: uppercase; }
    .course-tabs { display: flex; gap: 4px; margin: 20px 0; padding: 5px; border: 1px solid var(--line); border-radius: 13px; background: #fff; }
    .course-tab { flex: 1; min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: 9px; color: var(--ink-500); font-size: 10px; font-weight: 750; }

    .overview-grid { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(300px,.75fr); gap: 18px; }

    .focus-list { display: flex; flex-direction: column; gap: 9px; margin-top: 16px; }

    .ai-course-card { position: relative; overflow: hidden; padding: 22px; background: var(--blue-600); color: #fff; }

    /* Contribution wizard */

    .selected-file { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid #bcebd8; border-radius: 15px; background: #f0fdf7; }

    /* Community */

    .leaderboard-card { overflow: hidden; }

    .leader-row + .leader-row { border-top: 1px solid var(--line); }

    /* Panels */

    .ai-context strong { color: var(--blue-700); font-size: 9px; }
    .chat-body { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding: 0 18px 16px; }

    .modal { position: fixed; top: 50%; left: 50%; z-index: 110; width: min(520px,calc(100% - 28px)); visibility: hidden; overflow: hidden; border-radius: 20px; background: #fff; box-shadow: var(--shadow-lg); opacity: 0; transform: translate(-50%,-46%) scale(.98); transition: var(--ease); }

      const blob = uploadedFile || new Blob([content],{type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const safeName = `${course.code}-${resource.title}`.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();
      link.href=url; link.download=uploadedFile?.name || `${safeName || 'masdar-resource'}.txt`; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      notify('success',uploadedFile?'Original uploaded file download started.':'Demo resource download started.');
    }

    function opportunityRow(opportunity) {

    function renderExplore() {

          <div class="context-grid">

          </div>

        </section>
        <div class="field mobile-category-field"><label for="mobile-category">Resource type</label><select id="mobile-category" onchange="setCategory(this.value)">${categories.map(category => `<option value="${category.value}" ${category.value===state.category?'selected':''}>${category.label}</option>`).join('')}</select></div>
        <div class="category-strip" role="group" aria-label="Resource category">${categories.map(category => `<button class="category-chip ${category.value===state.category?'active':''}" onclick="setCategory('${category.value}')"><i data-lucide="${category.icon}"></i>${category.label}</button>`).join('')}</div>
        <div class="results-toolbar"><div class="result-search"><i data-lucide="search"></i><input type="search" id="resource-search" value="${escapeHtml(state.query)}" placeholder="Search across ${pickedCourses.length} selected ${pickedCourses.length===1?'course':'courses'}" aria-label="Search selected course resources" oninput="setResourceQuery(this.value)"></div><button class="btn btn-secondary saved-filter ${state.savedOnly?'active':''}" onclick="toggleSavedFilter()" aria-pressed="${state.savedOnly}"><i data-lucide="bookmark"></i>Saved</button><select class="sort-select" aria-label="Sort resources" onchange="setResourceSort(this.value)"><option value="quality" ${state.sort==='quality'?'selected':''}>Highest quality</option><option value="helpful" ${state.sort==='helpful'?'selected':''}>Most helpful</option><option value="recent" ${state.sort==='recent'?'selected':''}>Most recent</option></select></div>
        <div id="explore-results"></div>`;

    function renderExploreResults() {
      const target = document.getElementById('explore-results');
      if (!target) return;
      const query = state.query.trim().toLowerCase();
      let resources = selectedCourseResources().filter(resource => {
        const categoryMatch = state.category === 'All' || resource.type === state.category;
        const text = [resource.title,resource.type,resource.uploader,...resource.tags].join(' ').toLowerCase();
        return categoryMatch && (!state.savedOnly || resource.saved) && (!query || text.includes(query));
      });
      if (state.sort === 'quality') resources.sort((a,b) => b.rating - a.rating);
      else if (state.sort === 'helpful') resources.sort((a,b) => b.helpful - a.helpful);
      else resources.sort((a,b) => b.id - a.id);
      const selected = selectedCourses();
      const scope = selected.length === 1 ? selected[0].code : `${selected.length} selected courses`;
      target.innerHTML = `<p class="results-meta">${resources.length} ${resources.length===1?'resource':'resources'} across ${scope}${state.category!=='All'?` · ${categoryLabel(state.category)}`:''}${state.savedOnly?' · Saved only':''}</p>${resources.length?`<section class="resource-grid">${resources.map(resourceCard).join('')}</section>`:`<div class="empty-state"><span class="empty-icon"><i data-lucide="${state.savedOnly?'bookmark-x':'search-x'}"></i></span><h3>${state.savedOnly?'No saved resources here':'No matching resources'}</h3><p>${state.savedOnly?'Save useful material and it will appear in this view.':'Try another keyword or category. You can also request what you need from the community.'}</p><button class="btn btn-primary" onclick="${state.savedOnly?'toggleSavedFilter()':'openRequestModal()'}">${state.savedOnly?'Show all resources':'Request a resource'}</button></div>`}`;
      iconRefresh();
    }

      state.coursePickerOpen = false; state.category = 'All'; state.query = ''; renderExplore(); updateShell();

    function selectMajor(value) { state.majorId = Number(value); state.coursePickerOpen=false; state.category='All'; state.query=''; renderExplore(); updateShell(); }

    function toggleCourseSelection(id,event) {

    function renderContribute() {
      const app = document.getElementById('app');
      app.innerHTML = `<header class="page-head"><div><div class="eyebrow">Community contribution</div><h1>Share a study resource</h1><p>Three short steps. Masdar handles quality review and AI indexing after you publish.</p></div></header><div class="wizard-shell"><div class="stepper">${[['File',1],['Details',2],['Review',3]].map(([label,step])=>`<div class="step ${state.uploadStep===step?'active':state.uploadStep>step?'done':''}"><span class="step-number">${state.uploadStep>step?'<i data-lucide="check" style="width:13px;height:13px"></i>':step}</span><span>${label}</span></div>`).join('')}</div><section class="card wizard-card" id="wizard-card"></section></div>`;
      renderUploadStep();
    }

    function renderUploadStep() {
      const card = document.getElementById('wizard-card');
      if (!card) return;
      if (state.uploadStep === 1) {
        card.innerHTML = `<div class="wizard-header"><h2>Choose your file</h2><p>PDF and DOCX up to 10 MB. You can review every detail before publishing.</p></div><div class="wizard-body">${state.selectedFile?`<div class="selected-file"><span class="file-icon"><i data-lucide="file-check-2"></i></span><span class="file-meta"><strong>${escapeHtml(state.selectedFile.name)}</strong><span>${state.selectedFile.sizeLabel} · Ready to continue</span></span><button class="icon-button" onclick="removeUploadFile()" aria-label="Remove selected file"><i data-lucide="x"></i></button></div>`:`<input class="sr-only" id="upload-file" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" onchange="handleUploadFile(this.files[0])"><div class="dropzone" id="dropzone" role="button" tabindex="0" onclick="document.getElementById('upload-file').click()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('upload-file').click()}" ondragover="setDropState(event,true)" ondragleave="setDropState(event,false)" ondrop="handleUploadDrop(event)"><div><span class="drop-icon"><i data-lucide="upload-cloud"></i></span><h3>Drop a file here</h3><p>or select it from your device</p><button class="btn btn-soft" type="button">Choose file</button></div></div>`}</div><div class="wizard-footer"><span></span><button class="btn btn-primary" ${state.selectedFile?'':'disabled'} onclick="goUploadStep(2)">Continue <i data-lucide="arrow-right"></i></button></div>`;
      } else if (state.uploadStep === 2) {
        const request = data.requests.find(item => item.id === state.uploadDraft.requestId);
        card.innerHTML = `<div class="wizard-header"><h2>Describe the resource</h2><p>Accurate context helps students find it and helps the AI tutor use it correctly.</p></div><div class="wizard-body">${request?`<div class="request-match"><span><strong>Fulfilling a community request</strong><span>${escapeHtml(request.title)} · +${request.bounty} points</span></span><span class="badge badge-amber">${request.bounty} pts</span></div>`:''}<div class="form-grid"><div class="field full"><label for="upload-title">Resource title</label><input id="upload-title" maxlength="120" value="${escapeHtml(state.uploadDraft.title)}" placeholder="e.g. Calculus II Midterm 2025 - Solved" oninput="state.uploadDraft.title=this.value"></div><div class="field"><label for="upload-course">Course</label><select id="upload-course" onchange="state.uploadDraft.courseId=Number(this.value)">${data.courses.map(course=>`<option value="${course.id}" ${course.id===state.uploadDraft.courseId?'selected':''}>${course.code} · ${course.name}</option>`).join('')}</select></div><div class="field"><label for="upload-type">Resource type</label><select id="upload-type" onchange="state.uploadDraft.type=this.value">${categories.slice(1).map(category=>`<option value="${category.value}" ${category.value===state.uploadDraft.type?'selected':''}>${category.label}</option>`).join('')}</select></div><div class="field full"><label for="upload-tags">Topic tags</label><input id="upload-tags" value="${escapeHtml(state.uploadDraft.tags)}" placeholder="integration, midterm, solved" oninput="state.uploadDraft.tags=this.value"></div></div></div><div class="wizard-footer"><button class="btn btn-secondary" onclick="goUploadStep(1)"><i data-lucide="arrow-left"></i>Back</button><button class="btn btn-primary" onclick="validateUploadDetails()">Review <i data-lucide="arrow-right"></i></button></div>`;
      } else if (state.uploadStep === 3) {
        const course=data.courses.find(item=>item.id===state.uploadDraft.courseId);
        card.innerHTML = `<div class="wizard-header"><h2>Review before publishing</h2><p>Confirm the information below. The resource enters community review after publishing.</p></div><div class="wizard-body"><div class="review-summary"><div class="summary-row"><span>File</span><strong>${escapeHtml(state.selectedFile?.name)}</strong></div><div class="summary-row"><span>Title</span><strong>${escapeHtml(state.uploadDraft.title)}</strong></div><div class="summary-row"><span>Course</span><strong>${course.code} · ${course.name}</strong></div><div class="summary-row"><span>Type</span><strong>${categoryLabel(state.uploadDraft.type)}</strong></div><div class="summary-row"><span>Tags</span><strong>${escapeHtml(state.uploadDraft.tags || 'No tags')}</strong></div></div><div class="field" style="margin-top:18px"><label for="upload-text">Optional text for the AI tutor</label><textarea id="upload-text" placeholder="Paste key facts or a short summary to improve course-aware answers." oninput="state.uploadDraft.text=this.value">${escapeHtml(state.uploadDraft.text)}</textarea></div><div class="consent-row"><input type="checkbox" id="upload-consent"><label for="upload-consent">I confirm that this resource is relevant to the selected course and that I have permission to share it with the student community.</label></div></div><div class="wizard-footer"><button class="btn btn-secondary" onclick="goUploadStep(2)"><i data-lucide="arrow-left"></i>Back</button><button class="btn btn-primary" onclick="publishResource()"><i data-lucide="upload-cloud"></i>Publish resource</button></div>`;
      } else if (state.uploadStep === 4) {
        card.innerHTML = `<div class="publish-progress"><div class="progress-spinner"></div><h3>Preparing your resource</h3><p>Saving metadata, creating searchable sections, and adding it to community review.</p></div>`;
      } else {
        card.innerHTML = `<div class="success-state"><span class="success-icon"><i data-lucide="check"></i></span><h2>Your resource is live</h2><p>Students can now discover it. It will earn a verified badge after the community quality threshold is reached.</p><span class="points-earned"><i data-lucide="award" style="width:14px;height:14px"></i>+15 reputation points</span><div><button class="btn btn-primary" onclick="viewPublishedResource()">View resource</button><button class="btn btn-secondary" style="margin-left:7px" onclick="resetUpload()">Share another</button></div></div>`;

      iconRefresh();

    function setDropState(event,active) { event.preventDefault(); document.getElementById('dropzone')?.classList.toggle('dragging',active); }
    function handleUploadDrop(event) { setDropState(event,false); handleUploadFile(event.dataTransfer?.files?.[0]); }
    function handleUploadFile(file) {
      if (!file) return;
      const extension=file.name.split('.').pop()?.toLowerCase();
      if (!['pdf','docx'].includes(extension)) return notify('error','Please select a PDF or DOCX file.');
      if (file.size>10*1024*1024) return notify('error','The selected file is larger than 10 MB.');
      const sizeLabel=file.size>=1024*1024?`${(file.size/1024/1024).toFixed(1)} MB`:`${Math.max(1,Math.ceil(file.size/1024))} KB`;
      state.selectedFile={name:file.name,size:file.size,sizeLabel,file}; renderUploadStep();
    }
    function removeUploadFile() { state.selectedFile=null; renderUploadStep(); }
    function goUploadStep(step) { state.uploadStep=step; renderContribute(); }
    function validateUploadDetails() { if(!state.uploadDraft.title.trim()) return notify('error','Add a clear resource title.'); goUploadStep(3); }
    function publishResource() {
      if (!document.getElementById('upload-consent')?.checked) return notify('error','Please confirm that you can share this resource.');
      state.uploadStep=4; renderUploadStep();
      setTimeout(()=>{
        const id=Math.max(...data.resources.map(resource=>resource.id))+1;
        const resource={ id, courseId:state.uploadDraft.courseId, title:state.uploadDraft.title.trim(), type:state.uploadDraft.type, semester:'Spring 2026', tags:state.uploadDraft.tags.split(',').map(tag=>tag.trim()).filter(Boolean), uploader:'Student Ahmed', rating:0, reviews:0, helpful:0, verified:false, representative:false, saved:false, userHelpful:false, userRating:0, text:state.uploadDraft.text.trim() || `Student-contributed resource for ${state.uploadDraft.title.trim()}.` };
        data.resources.unshift(resource); state.selectedResourceId=id;
        if(state.selectedFile?.file) runtimeFiles.set(id,state.selectedFile.file);
        const user=currentUser(); user.points+=15; user.uploads+=1;
        if(state.uploadDraft.requestId){ const request=data.requests.find(item=>item.id===state.uploadDraft.requestId); if(request){request.fulfilled=true;user.points+=request.bounty;} }
        persistData(); state.uploadStep=5; renderContribute(); updateShell();
      },1300);
    }
    function viewPublishedResource(){ const id=state.selectedResourceId; resetUpload(false); state.view='explore'; state.courseId=data.resources.find(resource=>resource.id===id)?.courseId||state.courseId; render(); setTimeout(()=>openResource(id),50); }
    function resetUpload(renderNow=true){ state.uploadStep=1; state.selectedFile=null; state.uploadDraft={courseId:state.courseId,type:'Previous Exam',title:'',tags:'',text:'',requestId:null}; if(renderNow)renderContribute(); }

    function renderCommunity() {
      const app=document.getElementById('app');
      app.innerHTML=`<header class="page-head"><div><div class="eyebrow">Students help students</div><h1>Community</h1><p>Request missing material, help prioritize what matters, and recognize trusted contributors.</p></div>${state.communityTab==='requests'?'<button class="btn btn-primary" onclick="openRequestModal()"><i data-lucide="plus"></i>New request</button>':''}</header><div class="segmented"><button class="segment ${state.communityTab==='requests'?'active':''}" onclick="setCommunityTab('requests')">Resource requests</button><button class="segment ${state.communityTab==='contributors'?'active':''}" onclick="setCommunityTab('contributors')">Top contributors</button></div><div id="community-content"></div>`;
      renderCommunityContent();
    }
    function setCommunityTab(tab){state.communityTab=tab;renderCommunity();}
    function renderCommunityContent(){const target=document.getElementById('community-content');if(state.communityTab==='requests'){const active=data.requests.filter(request=>!request.fulfilled).sort((a,b)=>b.votes-a.votes);target.innerHTML=active.length?`<div class="request-list">${active.map(request=>{const course=data.courses.find(item=>item.id===request.courseId);return `<article class="card request-card"><div><div class="request-tags"><span class="badge badge-blue">${course.code}</span><span class="badge badge-gray">${request.type}</span><span class="badge badge-amber">${request.bounty} pts</span></div><h3>${escapeHtml(request.title)}</h3><p>Requested by ${escapeHtml(request.requester)}</p></div><div class="request-actions"><button class="vote-button ${request.voted?'active':''}" onclick="toggleRequestVote(${request.id})" aria-label="Upvote request" aria-pressed="${request.voted}"><i data-lucide="chevron-up"></i><span>${request.votes}</span></button><button class="btn btn-soft btn-small" onclick="fulfillRequest(${request.id})"><i data-lucide="upload-cloud"></i>Fulfill</button></div></article>`}).join('')}</div>`:`<div class="empty-state"><span class="empty-icon"><i data-lucide="check"></i></span><h3>All requests are fulfilled</h3><p>The community is up to date.</p></div>`}else{const sorted=[...data.contributors].sort((a,b)=>b.points-a.points);target.innerHTML=`<section class="card leaderboard-card">${sorted.map((person,index)=>`<div class="leader-row"><span class="leader-rank">${index<3?['🥇','🥈','🥉'][index]:index+1}</span><span class="leader-person"><span class="leader-avatar">${initials(person.name)}</span><span><strong>${escapeHtml(person.name)}${person.id===1?' <span class="badge badge-blue" style="margin-left:5px">You</span>':''}</strong><span>${escapeHtml(person.dept)} · ${person.uploads} resources</span></span></span><span class="leader-points">${person.points} pts</span></div>`).join('')}</section>`}iconRefresh();}
    function toggleRequestVote(id){const request=data.requests.find(item=>item.id===id);if(!request)return;request.voted=!request.voted;request.votes+=request.voted?1:-1;persistData();renderCommunity();}
    function fulfillRequest(id){const request=data.requests.find(item=>item.id===id);if(!request)return;state.uploadDraft={courseId:request.courseId,type:request.type,title:`Fulfillment: ${request.title}`,tags:'',text:'',requestId:id};state.uploadStep=1;state.selectedFile=null;navigate('contribute');notify('info',`Upload a matching resource to earn ${request.bounty} points.`);}

    function openRequestModal(){const course=currentCourse();document.getElementById('request-form').innerHTML=`<div class="field full"><label for="request-title">What material do you need?</label><input id="request-title" maxlength="120" placeholder="e.g. Second exam with solutions"></div><div class="field"><label for="request-course">Course</label><select id="request-course">${data.courses.map(item=>`<option value="${item.id}" ${item.id===course.id?'selected':''}>${item.code} · ${item.name}</option>`).join('')}</select></div><div class="field"><label for="request-type">Type</label><select id="request-type">${categories.slice(1).map(category=>`<option value="${category.value}">${category.label}</option>`).join('')}</select></div><div class="field full"><label for="request-bounty">Bounty points</label><select id="request-bounty"><option value="20">20 points</option><option value="40" selected>40 points</option><option value="80">80 points</option></select></div>`;openModal('request-modal');iconRefresh();}
    function submitRequest(){const title=document.getElementById('request-title')?.value.trim();const bounty=Number(document.getElementById('request-bounty')?.value);const user=currentUser();if(!title)return notify('error','Describe the material you need.');if(user.points<bounty)return notify('error','You do not have enough reputation points.');data.requests.push({id:Math.max(...data.requests.map(request=>request.id))+1,courseId:Number(document.getElementById('request-course').value),type:document.getElementById('request-type').value,title,requester:'Student Ahmed',votes:1,bounty,voted:true,fulfilled:false});user.points-=bounty;persistData();closePanels();state.communityTab='requests';navigate('community');notify('success','Your request is now visible to the community.');}

    function openResource(id) {
      const resource=data.resources.find(item=>item.id===id); if(!resource)return;
      state.selectedResourceId=id;
      const course=data.courses.find(item=>item.id===resource.courseId);
      const hasOriginalFile=runtimeFiles.has(resource.id);
      document.getElementById('resource-drawer-title').textContent=resource.title;
      document.getElementById('resource-drawer-body').innerHTML=`
        <div class="detail-block">
          <div class="resource-card-top"><span class="type-chip"><span class="type-chip-icon" style="--resource-accent:${typeAccent(resource.type)}"><i data-lucide="${typeIcon(resource.type)}"></i></span>${resource.type}</span>${resource.verified?'<span class="verified"><i data-lucide="badge-check"></i>Community verified</span>':'<span class="badge badge-gray">Community review</span>'}</div>
          <h2 class="resource-detail-title">${escapeHtml(resource.title)}</h2>
          <p class="resource-detail-meta">${course.code} · ${course.instructor} · ${resource.semester}<br>Shared by ${escapeHtml(resource.uploader)}</p>
          <div class="tag-row">${resource.tags.map(tag=>`<span class="mini-tag">#${escapeHtml(tag)}</span>`).join('')}</div>
        </div>
        <div class="detail-block"><div class="download-ready"><span class="download-ready-icon"><i data-lucide="file-down"></i></span><span><strong>Ready to download</strong><small>${hasOriginalFile?'Original uploaded file': 'Demo text file · original PDF or DOCX in production'}</small></span><button class="btn btn-soft btn-small" onclick="downloadResource(${resource.id})"><i data-lucide="download"></i>Download</button></div></div>
        <div class="detail-block"><div class="detail-label">Quality summary</div><div class="quality-panel"><div class="quality-panel-top"><div><h3>${resource.verified?'Trusted by the community':'Building community confidence'}</h3><p>${resource.representative?'Marked representative of the course exam style.':'Quality updates as students review this resource.'}</p></div><span class="quality-number">${resource.reviews?resource.rating.toFixed(1):'New'}</span></div><div class="quality-signals"><div class="signal"><strong>${resource.helpful}</strong><span>Helpful votes</span></div><div class="signal"><strong>${resource.reviews}</strong><span>Ratings</span></div><div class="signal"><strong>${resource.representative?'Yes':'—'}</strong><span>Representative</span></div></div></div></div>
        <div class="detail-block"><div class="detail-label">Resource preview</div><div class="resource-preview">${escapeHtml(resource.text)}</div></div>
        <div class="detail-block"><div class="rating-row"><span class="rating-copy"><strong>Rate this resource</strong><span>Your feedback improves ranking.</span></span><span class="star-buttons">${[1,2,3,4,5].map(star=>`<button class="star-button ${star<=resource.userRating?'active':''}" onclick="rateResource(${resource.id},${star})" aria-label="Rate ${star} out of 5" aria-pressed="${star<=resource.userRating}"><i data-lucide="star"></i></button>`).join('')}</span></div></div>`;
      document.getElementById('resource-drawer-foot').innerHTML=`<button class="btn btn-secondary" onclick="downloadResource(${resource.id})"><i data-lucide="download"></i>Download</button><button class="btn ${resource.userHelpful?'btn-soft':'btn-secondary'}" onclick="toggleHelpful(${resource.id})"><i data-lucide="thumbs-up"></i>${resource.userHelpful?'Helpful ✓':'Helpful'}</button><button class="btn btn-primary" onclick="askAboutResource(${resource.id})"><i data-lucide="sparkles"></i>Ask AI</button>`;
      openDrawer('resource-drawer'); iconRefresh();
    }
    function toggleHelpful(id){const resource=data.resources.find(item=>item.id===id);if(!resource)return;resource.userHelpful=!resource.userHelpful;resource.helpful+=resource.userHelpful?1:-1;persistData();openResource(id);notify(resource.userHelpful?'success':'info',resource.userHelpful?'Marked as helpful.':'Helpful vote removed.');if(state.view==='explore')renderExploreResults();}
    function rateResource(id,rating){const resource=data.resources.find(item=>item.id===id);if(!resource)return;if(resource.userRating){const total=resource.rating*resource.reviews-resource.userRating+rating;resource.rating=total/resource.reviews;}else{resource.rating=(resource.rating*resource.reviews+rating)/(resource.reviews+1);resource.reviews+=1;}resource.userRating=rating;persistData();openResource(id);notify('success','Rating saved. Thank you.');}

    function openTutor(){renderTutor();openDrawer('ai-drawer');setTimeout(()=>document.getElementById('ai-input')?.focus(),280);}
    function renderTutor(){const course=currentCourse();if(state.aiCourseId!==course.id){state.aiCourseId=course.id;state.aiMessages=[];}document.getElementById('ai-context-course').textContent=`${course.code} · ${course.name}`;if(!state.aiMessages.length)state.aiMessages.push({role:'bot',text:`I’m ready to help with ${course.name}. I’ll ground answers in the ${courseResources(course.id).length} resources shared for this course.`});document.getElementById('chat-body').innerHTML=state.aiMessages.map(message=>`<div class="chat-message ${message.role}">${escapeHtml(message.text).replace(/\n/g,'<br>')}${message.source?`<div class="source-card"><strong>Source used</strong>${escapeHtml(message.source)}</div>`:''}</div>`).join('');const topics=courseTopics[course.id]||[course.name,'core concepts','real applications'];const prompts=[`Explain ${topics[0]}`,`Create 5 quiz questions on ${topics[1]}`,`Where is ${topics[2]} used?`];document.getElementById('quick-prompts').innerHTML=prompts.map(prompt=>`<button class="quick-prompt" onclick="askTutor('${prompt.replace(/'/g,"\\'")}')">${escapeHtml(prompt)}</button>`).join('');iconRefresh();setTimeout(()=>{const body=document.getElementById('chat-body');body.scrollTop=body.scrollHeight},0);}
    function askTutor(question){document.getElementById('ai-input').value=question;sendAiMessage();}
    function sendAiMessage(){const input=document.getElementById('ai-input');const query=input?.value.trim();if(!query)return;state.aiMessages.push({role:'user',text:query});input.value='';renderTutor();setTimeout(()=>{const answer=generateAiAnswer(query);state.aiMessages.push({role:'bot',text:answer.text,source:answer.source});renderTutor();},650);}
    function generateAiAnswer(query){const q=query.toLowerCase();const resources=courseResources(state.courseId);const best=resources.find(resource=>resource.tags.some(tag=>q.includes(tag.toLowerCase())))||resources[0];if(q.includes('question')||q.includes('quiz')||q.includes('exam'))return{text:'Here are three course-focused practice prompts:\n1. Identify the correct method and explain why.\n2. Solve a representative problem step by step.\n3. Describe one common exam mistake and how to avoid it.',source:best?.title};if(q.includes('why')||q.includes('career')||q.includes('used')){const relevance=(data.career[state.courseId]||[])[0];return{text:relevance?`${relevance.title}: ${relevance.description}`:'This topic builds problem-solving patterns that transfer to real systems and technical work.',source:best?.title};}if(q.includes('integration'))return{text:'Integration by parts rewrites an integral using ∫u dv = uv - ∫v du. Choose u with the LIATE guideline, compute du and v, then simplify the remaining integral. Start by checking whether the product becomes easier after differentiating one factor.',source:best?.title};if(q.includes('avl')||q.includes('rotation'))return{text:'An AVL tree keeps every node’s balance factor between -1 and 1. After insertion, move upward to the first unbalanced node and choose LL, RR, LR, or RL rotation based on the insertion path.',source:best?.title};return{text:best?`Based on “${best.title}”, the key idea is: ${best.text.slice(0,220)}${best.text.length>220?'…':''}`:'I could not find a matching course source yet. Try another phrase or contribute lecture notes to expand the course knowledge base.',source:best?.title};}
    function askAboutResource(id){const resource=data.resources.find(item=>item.id===id);if(!resource)return;closePanels();state.courseId=resource.courseId;updateShell();openTutor();setTimeout(()=>askTutor(`Summarize the key ideas in ${resource.title}`),80);}

    function openCourseCatalog() {
      const univSelect = document.getElementById('catalog-univ');
      if (univSelect) {
        univSelect.innerHTML = data.universities.map(u => `<option value="${u.id}" ${u.id===state.universityId?'selected':''}>${u.name}</option>`).join('');
      }
      filterCatalogUniv(state.universityId, false);
      const searchInput = document.getElementById('catalog-search');
      if (searchInput) searchInput.value = '';
      openModal('catalog-modal');
      renderCatalogGrid('');
      iconRefresh();
    }

    function filterCatalogUniv(univId, updateGrid = true) {
      state.universityId = Number(univId);
      const majors = data.majors.filter(m => m.universityId === state.universityId);
      if (!majors.some(m => m.id === state.majorId)) {
        state.majorId = majors[0]?.id || 1;
      }
      const majorSelect = document.getElementById('catalog-major');
      if (majorSelect) {
        majorSelect.innerHTML = majors.map(m => `<option value="${m.id}" ${m.id===state.majorId?'selected':''}>${m.name}</option>`).join('');
      }
      if (updateGrid) renderCatalogGrid();
    }

    function filterCatalogMajor(majorId) {
      state.majorId = Number(majorId);
      renderCatalogGrid();
    }

    function filterCatalogSearch(query) {
      renderCatalogGrid(query);
    }

    function renderCatalogGrid(query = '') {
      const target = document.getElementById('catalog-courses-grid');
      if (!target) return;
      const q = (query !== undefined ? query : (document.getElementById('catalog-search')?.value || '')).trim().toLowerCase();
      
      let courses = data.courses;
      if (!q) {
        courses = courses.filter(c => c.majorId === state.majorId);
      } else {
        courses = courses.filter(c => 
          c.code.toLowerCase().includes(q) || 
          c.name.toLowerCase().includes(q) || 
          c.instructor.toLowerCase().includes(q)
        );
      }

      if (!courses.length) {
        target.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><span class="empty-icon"><i data-lucide="search-x"></i></span><h3>No matching courses</h3><p>Try searching another course code (e.g. MATH 201, CS 211, SE 312) or change the major filter.</p></div>`;
        iconRefresh();
        return;
      }

      target.innerHTML = courses.map(course => {
        const resCount = courseResources(course.id).length;
        const isActive = course.id === state.courseId;
        const isSelected = state.selectedCourseIds.includes(course.id);
        return `
          <div class="card catalog-course-card ${isActive ? 'active-course' : ''}" style="padding: 14px; cursor: pointer; border: 2px solid ${isActive ? 'var(--blue-600)' : 'var(--line)'}; border-radius: 14px; transition: var(--ease); background: ${isActive ? 'var(--blue-50)' : 'var(--surface)'};" onclick="selectCourseFromCatalog(${course.id})">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px;">
              <span class="badge ${isActive ? 'badge-blue' : 'badge-gray'}">${course.code}</span>
              ${isActive ? '<span class="badge badge-green">Active ✓</span>' : isSelected ? '<span class="badge badge-blue">Selected</span>' : ''}
            </div>
            <strong style="display: block; font-size: 13px; color: var(--ink-900); margin-bottom: 4px;">${escapeHtml(course.name)}</strong>
            <p style="color: var(--ink-500); font-size: 10px; margin-bottom: 10px;">${escapeHtml(course.instructor)} · ${course.semester}</p>
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--blue-700); font-weight: 750;">
              <span>${resCount} materials</span>
              <span>Open course →</span>
            </div>
          </div>
        `;
      }).join('');
      iconRefresh();
    }

    function selectCourseFromCatalog(courseId) {
      state.courseId = courseId;
      if (!state.selectedCourseIds.includes(courseId)) {
        state.selectedCourseIds.push(courseId);
      }
      const course = data.courses.find(c => c.id === courseId);
      if (course) {
        state.majorId = course.majorId;
        const major = data.majors.find(m => m.id === course.majorId);
        if (major) state.universityId = major.universityId;
      }
      state.uploadDraft.courseId = courseId;
      persistData();
      closePanels();
      navigate('course');
      updateShell();
      notify('success', `Switched active course to ${currentCourse().code}: ${currentCourse().name}`);
    }

    function openDrawer(id){closePanels(false);document.getElementById(id).classList.add('open');document.getElementById(id).setAttribute('aria-hidden','false');document.getElementById('panel-backdrop').classList.add('visible');document.body.classList.add('panel-open');}
    function openModal(id){closePanels(false);document.getElementById(id).classList.add('open');document.getElementById(id).setAttribute('aria-hidden','false');document.getElementById('panel-backdrop').classList.add('visible');document.body.classList.add('panel-open');}
    function closePanels(clearBackdrop=true){document.querySelectorAll('.drawer,.modal').forEach(panel=>{panel.classList.remove('open');panel.setAttribute('aria-hidden','true')});if(clearBackdrop){document.getElementById('panel-backdrop').classList.remove('visible');document.body.classList.remove('panel-open');}}

    function notify(type,message){const stack=document.getElementById('toast-stack');const id=`toast-${Date.now()}`;const icon=type==='success'?'check-circle-2':type==='error'?'circle-alert':'info';stack.insertAdjacentHTML('beforeend',`<div class="toast ${type}" id="${id}"><i data-lucide="${icon}"></i><span>${escapeHtml(message)}</span></div>`);iconRefresh();setTimeout(()=>document.getElementById(id)?.remove(),3300);}

    document.addEventListener('keydown',event=>{if(event.key==='Escape')closePanels();});
    document.addEventListener('click',event=>{if(!event.target.closest('.course-multi')){state.coursePickerOpen=false;const picker=document.getElementById('course-multi');picker?.classList.remove('open');picker?.querySelector('.multi-select-trigger')?.setAttribute('aria-expanded','false');}});
    window.addEventListener('load',()=>{restoreData();state.uploadDraft.courseId=state.courseId;const hash=location.hash.replace('#/','');if(['home','explore','course','contribute','community'].includes(hash))state.view=hash;render();});
  </script>
</body>
</html>
